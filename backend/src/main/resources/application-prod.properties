# --- Database (from environment) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Optional but common in prod:
spring.datasource.hikari.maximum-pool-size=10

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# --- Flyway (Step 3 will add migrations) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT (from environment) ---
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# --- CORS (browsers / Expo web). Native apps typically omit Origin and skip CORS. ---
# Override via CORS_ALLOWED_ORIGIN_PATTERNS (comma-separated) if needed.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://*}

# --- Logging ---
logging.level.root=WARN
logging.level.uk.deadcatlab.bakbak=INFO